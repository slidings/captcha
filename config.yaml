seed: 100
data:
  train_dir: "data/cleaned_train"
  img_height: 64
  max_width: 384 
  grayscale: false
  num_workers: 4

train:
  batch_size: 64
  epochs: 120
  lr: 1e-3
  weight_decay: 1e-4
  grad_clip: 5.0
  lr_decay: 0.95

model:
  cnn_out_channels: 256
  lstm_hidden: 384
  lstm_layers: 2
  dropout: 0.3

log:
  print_every: 50
  ckpt_dir: "checkpoints_colour"
